name: ATHENA WORLD CI

on:
  push:
    branches:
      - master
      - world-intelligence-phase1
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile
        run: python -m compileall -q world tests
      - name: Test suite
        run: python -m pytest -q
